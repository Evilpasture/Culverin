name: Build Culverin Wheels

on:
  push:
    branches: 
      - master
      - optimization-WIP
    tags: [ 'v*' ]
  pull_request:
    branches: 
      - master

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # We use these three to cover all major platforms
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify Clang
        run: clang --version

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.22.0
        env:
          CIBW_FREE_THREADED_SUPPORT: 1
          # Focus only on 64-bit architectures
          CIBW_BUILD: "cp313t-manylinux_x86_64 cp313t-win_amd64 cp313t-macosx_*"
          
          # Linux 64-bit setup
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_BEFORE_ALL_LINUX: >
            yum install -y clang llvm && 
            clang --version
          CIBW_ENVIRONMENT_LINUX: "CC=clang CXX=clang++ Py_GIL_DISABLED=1"

          # Windows 64-bit setup
          CIBW_ENVIRONMENT_WINDOWS: >
            CMAKE_GENERATOR="Ninja" 
            CC="clang" 
            CXX="clang++" 
            Py_GIL_DISABLED=1

          # MacOS: Already works, don't touch it!
          MACOSX_DEPLOYMENT_TARGET: "13.0"
          
          CIBW_TEST_SKIP: "*"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: culverin-wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  release:
    name: Release Wheels
    needs: [build_wheels]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: wheelhouse
          pattern: culverin-wheels-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: wheelhouse/*.whl
          body: |
            Culverin Physics Release ${{ github.ref_name }}
            
            Optimized for:
            - Python 3.13t (Free-Threaded)
            - Python 3.14t (Free-Threaded Alpha)
            - High-performance AVX2 SIMD (x86_64)
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
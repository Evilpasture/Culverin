name: Build Culverin Wheels

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]

jobs:
  # ===========================================================================
  # JOB 1: PRODUCTION RELEASE (Clean Binaries)
  # ===========================================================================
  build_wheels:
    name: Release Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install Build Dependencies
        run: uv pip install --system scikit-build-core ninja numpy psutil

      - name: Build Wheels
        uses: pypa/cibuildwheel@v2.22.0
        env:
          CIBW_SKIP: "*-musllinux_*"
          CIBW_BUILD: "cp313-* cp314-*"
          CIBW_FREE_THREADED_SUPPORT: 1
          CIBW_ENVIRONMENT: >
            CC=clang 
            CXX=clang++ 
            CMAKE_GENERATOR=Ninja
            MACOSX_DEPLOYMENT_TARGET=13.0
            CMAKE_ARGS="-DENABLE_SANITIZER=OFF -DCMAKE_BUILD_TYPE=Release -DDOUBLE_PRECISION=ON -DJPH_DOUBLE_PRECISION=ON -DCMAKE_C_STANDARD=23"
          CIBW_ENVIRONMENT_WINDOWS: "CC=clang-cl CXX=clang-cl CMAKE_GENERATOR=Ninja"
          CIBW_BEFORE_ALL_LINUX: "dnf install -y clang llvm ninja-build"
          # No tests here to keep the release pipeline fast and clean

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: culverin-release-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  # ===========================================================================
  # JOB 2: SANITIZER VALIDATION (ASan/UBSan Check)
  # ===========================================================================
  check_sanitizers:
    name: Sanitizer Validation (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build and Test with ASan/UBSan
        uses: pypa/cibuildwheel@v2.22.0
        env:
          CIBW_SKIP: "*-musllinux_*"
          CIBW_BUILD: "cp313-manylinux_x86_64"
          CIBW_FREE_THREADED_SUPPORT: 1
          CIBW_BEFORE_ALL_LINUX: "dnf install -y clang llvm ninja-build"
          CIBW_ENVIRONMENT: >
            CC=clang 
            CXX=clang++ 
            CMAKE_GENERATOR=Ninja
            ENABLE_SANITIZER=ON
            ASAN_OPTIONS="detect_leaks=0:detect_odr_violation=0:halt_on_error=1"
            UBSAN_OPTIONS="print_stacktrace=1:halt_on_error=1"
            CMAKE_ARGS="-DENABLE_SANITIZER=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo -DDOUBLE_PRECISION=ON -DCMAKE_C_STANDARD=23"
          CIBW_TEST_REQUIRES: numpy psutil
          CIBW_TEST_COMMAND: >
            python {project}/tests/test_core.py && 
            python {project}/tests/benchmark.py --leak
      # We do NOT upload wheels from this job. They are for validation only.

  # ===========================================================================
  # JOB 3: PUBLISH (Only if RELEASE and SANITIZER jobs pass)
  # ===========================================================================
  github-release:
    name: Create GitHub Release
    needs: [build_wheels, check_sanitizers]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: wheelhouse
          pattern: culverin-release-*
          merge-multiple: true
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: wheelhouse/*.whl
          body: |
            Culverin Physics Release ${{ github.ref_name }}
            Standard Release Binaries (Sanitizer validated)
          prerelease: true

  pypi-publish:
    name: Upload to PyPI
    needs: [build_wheels, check_sanitizers]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: culverin-release-*
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
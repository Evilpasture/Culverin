name: Build Culverin Wheels

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Build Dependencies
        run: python -m pip install scikit-build-core ninja

      - name: Build and Test Wheels
        uses: pypa/cibuildwheel@v2.22.0
        env:
          CIBW_SKIP: "*-musllinux_*"
          CIBW_BUILD: "cp313-* cp314-*"
          CIBW_PRERELEASE_PYTHONS: True
          CIBW_FREE_THREADED_SUPPORT: 1
          PYTHONUTF8: 1
          CIBW_ARCHS: "auto64"

          # 1. Upgrade the Linux Image to support modern C23 toolchains
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
          CIBW_MUSLLINUX_X86_64_IMAGE: quay.io/pypa/musllinux_1_2_x86_64

          # 2. Updated Linux setup for AlmaLinux 8 (dnf is native here)
          CIBW_ENVIRONMENT_LINUX: CC=clang CXX=clang++
          CIBW_BEFORE_ALL_LINUX: >
            apk add --no-cache clang llvm-dev ninja build-base || 
            dnf install -y clang llvm ninja-build

          # 3. Force the C standard in CMAKE_ARGS if not in your CMakeLists.txt
          CIBW_ENVIRONMENT: >
            CC=clang 
            CXX=clang++ 
            CMAKE_GENERATOR=Ninja
            CMAKE_ARGS="-DDOUBLE_PRECISION=ON -DJPH_DOUBLE_PRECISION=ON -DCMAKE_C_STANDARD=23"
            MACOSX_DEPLOYMENT_TARGET=13.0

          CIBW_ENVIRONMENT_WINDOWS: "CC=clang-cl CXX=clang-cl CMAKE_GENERATOR=Ninja"

          CIBW_TEST_REQUIRES: numpy psutil
          CIBW_TEST_COMMAND: >
            python {project}/tests/test_core.py && 
            python {project}/tests/benchmark.py --leak

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: culverin-wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  github-release:
    name: Create GitHub Release
    needs: [build_wheels]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: wheelhouse
          pattern: culverin-wheels-*
          merge-multiple: true
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: wheelhouse/*.whl
          body: |
            Culverin Physics Release ${{ github.ref_name }}
            Targets: Python 3.13t (Free-Threaded)
          prerelease: true # Since it's a beta

  pypi-publish:
    name: Upload to PyPI
    needs: [build_wheels]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: culverin-wheels-*
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
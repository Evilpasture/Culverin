name: Build Culverin Wheels

on:
  push:
    branches: [ master, dev-remote ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, dev-remote ]

jobs:
  # ===========================================================================
  # JOB 1: PRODUCTION RELEASE (Clean Binaries)
  # ===========================================================================
  build_wheels:
    name: Release Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Upstream LLVM (macOS)
        if: runner.os == 'macOS'
        run: brew install llvm

      - name: Build Wheels
        uses: pypa/cibuildwheel@v3.4.0
        env:
          CIBW_SKIP: "*-musllinux_* *-win32 *_i686"
          CIBW_BUILD: "cp313-* cp313t-* cp314-* cp314t-*"
          CIBW_ENABLE: "cpython-freethreading"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
          
          CIBW_BUILD_FRONTEND: "uv"
          
          CIBW_ENVIRONMENT_LINUX: >
            CC=clang
            CXX=clang++
            CMAKE_GENERATOR=Ninja
            CMAKE_ARGS="-DENABLE_SANITIZER=OFF -DCMAKE_BUILD_TYPE=Release -DDOUBLE_PRECISION=ON"

          CIBW_ENVIRONMENT_WINDOWS: "CC=clang-cl CXX=clang-cl CMAKE_GENERATOR=Ninja"
          
          CIBW_ENVIRONMENT_MACOS: >
            CC=/opt/homebrew/opt/llvm/bin/clang
            CXX=/opt/homebrew/opt/llvm/bin/clang++
            CMAKE_GENERATOR=Ninja
            MACOSX_DEPLOYMENT_TARGET=13.0
            CMAKE_ARGS="-DENABLE_SANITIZER=OFF -DCMAKE_BUILD_TYPE=Release -DDOUBLE_PRECISION=ON"
          
          CIBW_BEFORE_ALL_LINUX: >
            (dnf install -y clang llvm || yum install -y clang llvm || apk add --no-cache clang llvm-dev) &&
            pip install ninja

          CIBW_TEST_REQUIRES: numpy psutil
          CIBW_TEST_COMMAND: "python {project}/tests/test_core.py"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: culverin-release-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  # ===========================================================================
  # JOB 2 & 3: SANITIZER VALIDATION (ASan/UBSan/TSan Check)
  # ===========================================================================
  check_sanitizers:
    name: Sanitizer Validation (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install LLVM 22
        run: |
          sudo apt-get update
          sudo apt-get install -y wget lsb-release software-properties-common gnupg
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Build and Test with ASan/UBSan
        uses: pypa/cibuildwheel@v3.4.0
        env:
          CIBW_SKIP: "*-musllinux_* *-win32 *_i686"
          CIBW_BUILD: "cp313-manylinux_x86_64"
          CIBW_ENABLE: "cpython-freethreading"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_BUILD_FRONTEND: "uv"
          
          CIBW_BEFORE_ALL_LINUX: "dnf install -y clang llvm compiler-rt libasan libubsan && pip install ninja"
          
          CIBW_ENVIRONMENT: >
            CC="clang-22 -fno-sanitize=alignment" 
            CXX="clang++-22 -fno-sanitize=alignment" 
            CMAKE_GENERATOR=Ninja
            ASAN_OPTIONS="detect_leaks=0:detect_odr_violation=0:halt_on_error=1"
            UBSAN_OPTIONS="print_stacktrace=1:halt_on_error=1"
            CMAKE_ARGS="-DENABLE_SANITIZER=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo -DDOUBLE_PRECISION=ON"
          
          CIBW_TEST_REQUIRES: numpy psutil
          CIBW_TEST_COMMAND: >
            ASAN_RT=$(find /usr -name "libasan.so.*" 2>/dev/null | head -n 1) ;
            UBSAN_RT=$(find /usr -name "libubsan.so.*" 2>/dev/null | head -n 1) ;
            echo "ASan found: ${ASAN_RT:-NOT FOUND}" ;
            echo "UBSan found: ${UBSAN_RT:-NOT FOUND}" ;
            if [ -n "$ASAN_RT" ] || [ -n "$UBSAN_RT" ]; then export LD_PRELOAD="$ASAN_RT $UBSAN_RT"; fi ;
            python {project}/tests/test_core.py && 
            python {project}/tests/benchmark.py --leak
    # Thread sanitizer
  linux_tsan:
    name: Thread Sanitizer Validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install LLVM 22
        run: |
          sudo apt-get update
          sudo apt-get install -y wget lsb-release software-properties-common gnupg
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13t" # Installs the free-threaded version natively

      - name: Build and Scan with TSan (Python 3.14t)
        env:
          CC: "/usr/bin/clang-22"
          CXX: "/usr/bin/clang++-22"
          CFLAGS: "-fsanitize=thread -g -O0 -fno-omit-frame-pointer"
          CXXFLAGS: "-fsanitize=thread -g -O0 -fno-omit-frame-pointer -DENABLE_SANITIZER -D__SANITIZE_THREAD__"
          LDFLAGS: "-fsanitize=thread"
          CMAKE_ARGS: "-DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_STANDARD=23 -DCMAKE_C_STANDARD_REQUIRED=ON -DENABLE_THREAD_SANITIZER=ON"
        run: |
          uv python install 3.14t
          uv venv --python 3.14t --clear
          
          uv pip install --python ./.venv/bin/python scikit-build-core numpy psutil pytest
          uv pip install --python ./.venv/bin/python -e . --no-build-isolation
          
          export TSAN_SYMBOLIZER_PATH=/usr/bin/llvm-symbolizer-22
          TSAN_LIB=$(find /usr/lib/llvm-22 -name "libclang_rt.tsan-x86_64.so" | head -n 1)
          
          # Use a single env export or separate the lines properly
          export LD_PRELOAD=$TSAN_LIB
          export TSAN_OPTIONS="suppressions=${{ github.workspace }}/tsan.supp second_deadlock_stack=1 halt_on_error=1 symbolize=1"
          
          # Run benchmark first
          ./.venv/bin/python tests/benchmark.py --stress
          
          # Then run the actual test suite
          ./.venv/bin/python tests/test_core.py

  # ===========================================================================
  # JOB 4: PUBLISH
  # ===========================================================================
  github-release:
    name: Create GitHub Release
    needs: [build_wheels, check_sanitizers]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: wheelhouse
          pattern: culverin-release-*
          merge-multiple: true

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: wheelhouse/*.whl
          body: |
            Culverin Physics Release ${{ github.ref_name }}
            Standard Release Binaries (Sanitizer validated)
          prerelease: true

  pypi-publish:
    name: Upload to PyPI
    needs: [build_wheels, check_sanitizers, linux_tsan]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: culverin-release-*
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  # ===========================================================================
  # JOB 5: PERFORMANCE REGRESSION
  # ===========================================================================
  performance_regression:
    name: Performance Regression Benchmarks
    needs: [build_wheels]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: culverin-release-ubuntu-latest
          path: dist
          merge-multiple: true

      - name: Install dependencies and Pre-built Wheel
        run: |
          uv pip install --system numpy psutil
          WHEEL=$(ls dist/culverin-*cp313-cp313-manylinux*.whl | head -n 1)
          uv pip install --system "$WHEEL"

      - name: Run Performance Suite
        shell: bash
        run: |
          echo "## Performance Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          
          # Fix: Explicitly point to the tests/ directory
          echo "Running test_perf.py..."
          python tests/test_perf.py >> $GITHUB_STEP_SUMMARY
          
          echo -e "\nRunning benchmark.py..."
          python tests/benchmark.py --leak >> $GITHUB_STEP_SUMMARY
          python tests/benchmark.py --churn >> $GITHUB_STEP_SUMMARY
          
          echo '```' >> $GITHUB_STEP_SUMMARY
        continue-on-error: false

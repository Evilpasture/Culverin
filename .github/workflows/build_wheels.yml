name: Build Culverin Wheels

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Build Dependencies
        run: python -m pip install scikit-build-core ninja

      - name: Build and Test Wheels
        uses: pypa/cibuildwheel@v2.22.0
        env:
          # --- 1. Python Target Configuration ---
          CIBW_FREE_THREADED_SUPPORT: 1
          # Target 3.13t and 3.14t (when available in cibuildwheel)
          CIBW_BUILD: "cp313t-*"
          CIBW_ARCHS: "x86_64 arm64" # arm64 for Apple Silicon support
          
          # --- 2. Build Environment (Clang Enforcer) ---
          CIBW_ENVIRONMENT: >
            CC=clang 
            CXX=clang++ 
            CMAKE_GENERATOR=Ninja
            CMAKE_ARGS="-DDOUBLE_PRECISION=ON -DJPH_DOUBLE_PRECISION=ON"

          # Linux Specific: Use dnf/yum for Manylinux images
          CIBW_BEFORE_ALL_LINUX: >
            dnf install -y clang llvm ninja-build || apt-get install -y clang llvm ninja-build

          # Windows Specific: cibuildwheel handles LLVM setup on windows-latest
          CIBW_ENVIRONMENT_WINDOWS: >
            CC=clang-cl 
            CXX=clang-cl 
            CMAKE_GENERATOR=Ninja
            CMAKE_ARGS="-DDOUBLE_PRECISION=ON -DJPH_DOUBLE_PRECISION=ON"

          # --- 3. THE TEST SUITE INTEGRATION ---
          # cibuildwheel installs the wheel in a virtual env and runs these
          CIBW_TEST_REQUIRES: numpy psutil
          CIBW_TEST_COMMAND: >
            python {project}/tests/test_core.py && 
            python {project}/tests/benchmark.py --leak

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: culverin-wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  release:
    name: Release Wheels
    needs: [build_wheels]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: wheelhouse
          pattern: culverin-wheels-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: wheelhouse/*.whl
          body: |
            Culverin Physics Release ${{ github.ref_name }}
            
            Verified via Unit Test Suite and Memory Leak Diagnostics.
            
            Targets:
            - Python 3.13t (Free-Threaded)
            - SIMD: AVX2 (x86_64), NEON (ARM64)
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
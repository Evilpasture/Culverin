name: Remote Dev Fast-Track (M-Series Bleeding Edge)

on:
  push:
    branches: [ remote-dev ]

jobs:
  fast_dev_check_macos:
    name: M-Series C23 (Full Suite)
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Latest Upstream LLVM
        run: |
          brew install llvm ninja
          echo "/opt/homebrew/opt/llvm/bin" >> $GITHUB_PATH

      - name: Build and Test
        uses: pypa/cibuildwheel@v3.4.0
        env:
          CIBW_BUILD: "cp313t-macosx_arm64"
          CIBW_ENABLE: "cpython-freethreading"
          CIBW_BUILD_FRONTEND: "uv"

          CIBW_ENVIRONMENT_MACOS: >
            CC="/opt/homebrew/opt/llvm/bin/clang"
            CXX="/opt/homebrew/opt/llvm/bin/clang++"
            LDFLAGS="-L/opt/homebrew/opt/llvm/lib -Wl,-rpath,/opt/homebrew/opt/llvm/lib"
            CPPFLAGS="-I/opt/homebrew/opt/llvm/include"
            CMAKE_GENERATOR=Ninja
            MACOSX_DEPLOYMENT_TARGET=14.0
            CMAKE_ARGS="-DCMAKE_C_STANDARD=23 -DCMAKE_C_STANDARD_REQUIRED=ON -DENABLE_SANITIZER=OFF -DCMAKE_BUILD_TYPE=Release -DDOUBLE_PRECISION=ON"

          CIBW_TEST_REQUIRES: numpy psutil pytest pytest-xdist
          
          # We tell pytest to look in {project}/tests/ specifically.
          # Since benchmark.py is in tests/, we call it via that path.
          CIBW_TEST_COMMAND: >
            pytest -n auto -v {project}/tests/test_core.py {project}/tests/test_perf.py &&
            python {project}/tests/benchmark.py --leak &&
            python {project}/tests/benchmark.py --stress &&
            python {project}/tests/benchmark.py --churn

      - name: Generate Summary
        if: always()
        run: |
          echo "### Culverin CI: Build Verified 🛡️" >> $GITHUB_STEP_SUMMARY
          echo "* **Arch:** M-Series (Apple Silicon)" >> $GITHUB_STEP_SUMMARY
          echo "* **Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "* **Tests:** Core, Perf, Leak, Stress, Churn" >> $GITHUB_STEP_SUMMARY

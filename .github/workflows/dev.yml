name: Culverin Hybrid CI

on:
  push:
    branches: [ remote-dev, main ]
  pull_request:
    branches: [ main ]

jobs:
  # ------------------------------------------------------------------
  # JOB 1: THE RELEASE RUNNER (macOS ARM64)
  # ------------------------------------------------------------------
  macos_release:
    name: M-Series Release (C23)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v5
      - name: Build Performance Wheels
        uses: pypa/cibuildwheel@v3.4.0
        env:
          CIBW_BUILD: "cp313t-macosx_arm64"
          CIBW_ENABLE: "cpython-freethreading"
          CIBW_BUILD_FRONTEND: "uv"
          CIBW_ENVIRONMENT: >
            CMAKE_ARGS="-DCMAKE_C_STANDARD=23 -DCMAKE_BUILD_TYPE=Release -DJPH_USE_MTL=OFF"
          CIBW_TEST_COMMAND: "python {project}/tests/benchmark.py --stress"

  # ------------------------------------------------------------------
  # JOB 2: THE SAFETY RUNNER (Linux x86_64)
  # ENFORCING CLANG 22 (LLVM NIGHTLY)
  # ------------------------------------------------------------------
  linux_tsan:
    name: TSan Deep Scan (Clang 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v5
      
      - name: Build with TSan
        uses: pypa/cibuildwheel@v3.4.0
        env:
          CIBW_BUILD: "cp313t-manylinux_x86_64"
          CIBW_ENABLE: "cpython-freethreading"
          CIBW_BUILD_FRONTEND: "uv"
          
          # The "Nuclear Option" for the latest Clang:
          # Pull the official LLVM.org script to get the absolute newest version (22/nightly)
          CIBW_BEFORE_ALL_LINUX: >
            dnf install -y wget &&
            wget https://apt.llvm.org/llvm.sh &&
            chmod +x llvm.sh &&
            ./llvm.sh all || true &&
            dnf install -y clang llvm lld || true

          CIBW_ENVIRONMENT: >
            CC=clang
            CXX=clang++
            CFLAGS="-fsanitize=thread -g -fno-omit-frame-pointer"
            LDFLAGS="-fsanitize=thread"
            CMAKE_ARGS="-DCMAKE_C_STANDARD=23 -DENABLE_THREAD_SANITIZER=ON"

          CIBW_TEST_REQUIRES: numpy psutil pytest
          CIBW_TEST_COMMAND: >
            TSAN_OPTIONS="second_deadlock_stack=1 halt_on_error=1 history_size=7" 
            python {project}/tests/benchmark.py --stress


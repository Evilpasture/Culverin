name: Culverin Hybrid CI

on:
  push:
    branches: [ remote-dev, main ]
  pull_request:
    branches: [ main ]

jobs:
  # 1. macOS Build (Speed & Apple Silicon)
  macos_release:
    name: M-Series Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v5
      - name: Build Wheels
        uses: pypa/cibuildwheel@v3.4.0
        env:
          CIBW_BUILD: "cp313t-macosx_arm64"
          CIBW_ENABLE: "cpython-freethreading"
          CIBW_BUILD_FRONTEND: "uv"
          CIBW_ENVIRONMENT_MACOS: >
            CMAKE_ARGS="-DCMAKE_BUILD_TYPE=Release -DCMAKE_C_STANDARD=23"

  # 2. Linux TSan (Safety & C23 Enforcement)
  linux_tsan:
    name: TSan Safety Scan (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v5
      
      - name: Build and Test with TSan
        uses: pypa/cibuildwheel@v3.4.0
        env:
          CIBW_BUILD: "cp313t-manylinux_x86_64"
          CIBW_ENABLE: "cpython-freethreading"
          CIBW_BUILD_FRONTEND: "uv"
          # We use CIBW_ENVIRONMENT to force TSan and C23 across all compiler calls
          CIBW_ENVIRONMENT: >
            CC=clang 
            CXX=clang++ 
            CFLAGS="-fsanitize=thread -g -fno-omit-frame-pointer" 
            LDFLAGS="-fsanitize=thread"
            CMAKE_ARGS="-DCMAKE_C_STANDARD=23 -DENABLE_THREAD_SANITIZER=ON"
          
          CIBW_TEST_REQUIRES: numpy psutil pytest
          CIBW_TEST_COMMAND: >
            TSAN_OPTIONS="second_deadlock_stack=1 halt_on_error=1" 
            python {project}/tests/benchmark.py --stress

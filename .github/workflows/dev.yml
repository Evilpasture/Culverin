name: Remote Dev Fast-Track

on:
  push:
    branches: [ remote-dev ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast_dev_check:
    name: Quick Build & Test (C23)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13t"

      - name: Install System Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm ninja-build libvulkan-dev google-shaderc ccache

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-ccache-culverin
          restore-keys: ${{ runner.os }}-ccache-

      - name: Build & Install Project
        env:
          CC: clang
          CXX: clang++
          # C23 Standard + ccache launchers + Culverin flags
          CMAKE_ARGS: >-
            -DCMAKE_C_STANDARD=23
            -DCMAKE_C_COMPILER_LAUNCHER=ccache
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
            -DENABLE_SANITIZER=OFF
            -DCMAKE_BUILD_TYPE=Release
            -DDOUBLE_PRECISION=ON
            -G Ninja
        run: |
          uv pip install numpy psutil
          # -v helps us see if ccache is actually being used in the logs
          uv pip install -v . 

      - name: Run Core Tests
        run: |
          uv run python tests/test_core.py
          
      - name: Quick Benchmarks
        run: |
          echo "## Dev Benchmarks ($(date +'%H:%M'))" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          uv run python tests/benchmark.py --leak >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

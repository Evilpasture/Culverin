name: Culverin M-Series CI

on:
  push:
    branches: [ remote-dev ]
  pull_request:
    branches: [ main ]

jobs:
  # Standard Build for Release
  build_wheels:
    name: Build Wheels (cp313t)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v5
      - name: Build
        uses: pypa/cibuildwheel@v3.4.0
        env:
          CIBW_BUILD: "cp313t-macosx_arm64"
          CIBW_ENABLE: "cpython-freethreading"
          CIBW_BUILD_FRONTEND: "uv"
          CIBW_ENVIRONMENT_MACOS: >
            MACOSX_DEPLOYMENT_TARGET=14.0
            CMAKE_ARGS="-DCMAKE_BUILD_TYPE=Release"

  # THE DEDICATED TSAN SCANNER
  tsan_race_detector:
    name: TSan Deep Scan
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install LLVM & Tools
        run: |
          brew install llvm ninja
          echo "/opt/homebrew/opt/llvm/bin" >> $GITHUB_PATH

      - name: Install Free-Threaded Python
        run: |
          curl -O https://www.python.org/ftp/python/3.13.1/python-3.13.1-macos11.pkg
          sudo installer -pkg python-3.13.1-macos11.pkg -target /

      - name: Build Extension with TSan
        run: |
          # Use the installed 3.13t
          uv venv --python 3.13t
          source .venv/bin/activate
          uv pip install numpy psutil setuptools scikit-build-core
          
          export CC="/opt/homebrew/opt/llvm/bin/clang"
          export CXX="/opt/homebrew/opt/llvm/bin/clang++"
          export CFLAGS="-fsanitize=thread -g -fno-omit-frame-pointer"
          export LDFLAGS="-fsanitize=thread"
          
          uv pip install -e . --no-build-isolation

      - name: Run TSan Stress Test
        run: |
          source .venv/bin/activate
          
          # 1. Locate the TSan dylib
          TSAN_DYLIB=$(find /opt/homebrew/opt/llvm -name "libclang_rt.tsan_osx_dynamic.dylib" | head -n 1)
          echo "Using TSan Dylib: $TSAN_DYLIB"
          
          # 2. Programmatically find the REAL Python executable and Library directory
          # We resolve the symlink of sys.executable to get the actual Mach-O binary
          REAL_PYTHON_PATH=$(python -c "import sys, os; print(os.path.realpath(sys.executable))")
          PYTHON_LIB_DIR=$(python -c "import sysconfig; print(sysconfig.get_config_var('LIBDIR'))")
          
          echo "Detected Real Python: $REAL_PYTHON_PATH"
          echo "Detected Lib Dir: $PYTHON_LIB_DIR"
          
          # 3. Copy to /tmp to escape SIP/Sandbox
          cp "$REAL_PYTHON_PATH" /tmp/tsan_python
          
          # 4. Fix RPATH so it finds the Python framework libraries from its new home
          install_name_tool -add_rpath "$PYTHON_LIB_DIR" /tmp/tsan_python
          
          # 5. Remove signature for DYLD_INSERT_LIBRARIES support
          codesign --remove-signature /tmp/tsan_python
          chmod +x /tmp/tsan_python
          
          # 6. Run the race detector
          export DYLD_INSERT_LIBRARIES=$TSAN_DYLIB
          export TSAN_OPTIONS="second_deadlock_stack=1 halt_on_error=1"
          
          # Use arch -arm64 to ensure we don't accidentally trigger arm64e PAC requirements
          arch -arm64 /tmp/tsan_python tests/benchmark.py --stress


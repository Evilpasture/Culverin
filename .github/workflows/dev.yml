name: Culverin Hybrid CI (macOS Dev + Linux Safety)

on:
  push:
    branches: [ remote-dev, main ]
  pull_request:
    branches: [ main ]

jobs:
  # ---------------------------------------------------------
  # JOB 1: Performance & Compatibility on macOS (Apple Silicon)
  # ---------------------------------------------------------
  macos_release_check:
    name: M-Series Release Check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build & Test (No Sanitizers)
        uses: pypa/cibuildwheel@v3.4.0
        env:
          CIBW_BUILD: "cp313t-macosx_arm64"
          CIBW_ENABLE: "cpython-freethreading"
          CIBW_BUILD_FRONTEND: "uv"
          CIBW_ENVIRONMENT_MACOS: >
            CMAKE_ARGS="-DCMAKE_BUILD_TYPE=Release -DDOUBLE_PRECISION=ON"
            MACOSX_DEPLOYMENT_TARGET=14.0

          CIBW_TEST_REQUIRES: numpy psutil pytest
          CIBW_TEST_COMMAND: >
            pytest {project}/tests/test_core.py &&
            python {project}/tests/benchmark.py --stress

  # ---------------------------------------------------------
  # JOB 2: ThreadSanitizer Race Detection on Linux
  # ---------------------------------------------------------
  linux_tsan_scan:
    name: TSan Deep Scan (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm ninja-build

      - name: Build with TSan Instrumentation
        run: |
          # Use free-threaded Python 3.13
          uv venv --python 3.13t
          source .venv/bin/activate
          
          # Install build & test deps
          uv pip install numpy psutil setuptools scikit-build-core
          
          # Instrument everything with TSan
          export CC=clang
          export CXX=clang++
          export CFLAGS="-fsanitize=thread -g -fno-omit-frame-pointer"
          export LDFLAGS="-fsanitize=thread"
          
          # Force build from source in editable mode
          uv pip install -e . --no-build-isolation

      - name: Run Race Detector
        run: |
          source .venv/bin/activate
          
          # On Linux, TSan options are passed via environment
          # halt_on_error=1 ensures CI fails the moment a race is found
          export TSAN_OPTIONS="second_deadlock_stack=1 halt_on_error=1 report_bugs=1"
          
          echo "Starting TSan Stress Test..."
          python tests/benchmark.py --stress


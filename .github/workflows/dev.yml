name: Culverin Hybrid CI

on:
  push:
    branches: [ remote-dev, main ]
  pull_request: [ main ]

jobs:
  # ------------------------------------------------------------------
  # JOB 1: THE RELEASE RUNNER (macOS ARM64)
  # LLVM 22 (Nightly/Head) for the latest C23 optimizations
  # ------------------------------------------------------------------
  macos_release:
    name: M-Series C23 Release (Clang 22)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v5
      - name: Build Performance Wheels
        uses: pypa/cibuildwheel@v3.4.0
        env:
          CIBW_BUILD: "cp313t-macosx_arm64"
          CIBW_ENABLE: "cpython-freethreading"
          CIBW_BUILD_FRONTEND: "uv"
          # Get the absolute head of LLVM
          CIBW_BEFORE_ALL: brew install llvm@22 || brew install llvm
          CIBW_ENVIRONMENT: >
            CC="$(brew --prefix llvm)/bin/clang"
            CXX="$(brew --prefix llvm)/bin/clang++"
            CMAKE_ARGS="-DCMAKE_C_STANDARD=23 -DCMAKE_C_STANDARD_REQUIRED=ON -DCMAKE_BUILD_TYPE=Release -DJPH_USE_MTL=OFF"
          CIBW_TEST_COMMAND: "python {project}/tests/benchmark.py --stress"

  # ------------------------------------------------------------------
  # JOB 2: THE SAFETY RUNNER (Linux x86_64)
  # LLVM 22 Nightly for C23 + TSan
  # ------------------------------------------------------------------
  linux_tsan:
    name: TSan C23 Deep Scan (Clang 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v5
      - name: Build with TSan
        uses: pypa/cibuildwheel@v3.4.0
        env:
          CIBW_BUILD: "cp313t-manylinux_x86_64"
          CIBW_ENABLE: "cpython-freethreading"
          CIBW_BUILD_FRONTEND: "uv"
          # Inject LLVM 22 Nightly repos into the manylinux container
          CIBW_BEFORE_ALL_LINUX: >
            dnf install -y wget &&
            wget https://apt.llvm.org/llvm.sh &&
            chmod +x llvm.sh &&
            ./llvm.sh 22 || ./llvm.sh all &&
            dnf install -y clang-22 llvm-22 lld-22 || dnf install -y clang llvm lld

          CIBW_ENVIRONMENT: >
            CC=clang
            CXX=clang++
            CFLAGS="-fsanitize=thread -g -O1 -fno-omit-frame-pointer"
            LDFLAGS="-fsanitize=thread -Wl,--allow-shlib-undefined"
            CMAKE_ARGS="-DCMAKE_C_STANDARD=23 -DCMAKE_C_STANDARD_REQUIRED=ON -DENABLE_THREAD_SANITIZER=ON"

          CIBW_TEST_REQUIRES: numpy psutil pytest
          CIBW_TEST_COMMAND: >
            TSAN_LIB=$(find /usr -name "libclang_rt.tsan-x86_64.so" | head -n 1) &&
            LD_PRELOAD=$TSAN_LIB 
            TSAN_OPTIONS="second_deadlock_stack=1 halt_on_error=1" 
            python {project}/tests/benchmark.py --stress


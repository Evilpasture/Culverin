name: Culverin M-Series CI

on:
  push:
    branches: [ remote-dev ]
  pull_request:
    branches: [ main ]

jobs:
  # Standard Build for Release
  build_wheels:
    name: Build Wheels (cp313t)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v5
      - name: Build
        uses: pypa/cibuildwheel@v3.4.0
        env:
          CIBW_BUILD: "cp313t-macosx_arm64"
          CIBW_ENABLE: "cpython-freethreading"
          CIBW_BUILD_FRONTEND: "uv"
          CIBW_ENVIRONMENT_MACOS: >
            MACOSX_DEPLOYMENT_TARGET=14.0
            CMAKE_ARGS="-DCMAKE_BUILD_TYPE=Release"

  # THE DEDICATED TSAN SCANNER
  tsan_race_detector:
    name: TSan Deep Scan
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install LLVM & Tools
        run: |
          brew install llvm ninja
          echo "/opt/homebrew/opt/llvm/bin" >> $GITHUB_PATH

      - name: Install Free-Threaded Python
        run: |
          curl -O https://www.python.org/ftp/python/3.13.1/python-3.13.1-macos11.pkg
          sudo installer -pkg python-3.13.1-macos11.pkg -target /

      - name: Build Extension with TSan
        run: |
          uv venv --python 3.13t
          source .venv/bin/activate
          uv pip install numpy psutil setuptools scikit-build-core
          
          export CC="/opt/homebrew/opt/llvm/bin/clang"
          export CXX="/opt/homebrew/opt/llvm/bin/clang++"
          export CFLAGS="-fsanitize=thread -g -fno-omit-frame-pointer"
          export LDFLAGS="-fsanitize=thread"
          
          uv pip install -e . --no-build-isolation

      - name: Run TSan Stress Test
        run: |
          source .venv/bin/activate
          
          # 1. Targeted find for the TSan dylib
          TSAN_DYLIB=$(find /opt/homebrew/opt/llvm/lib/clang -name "libclang_rt.tsan_osx_dynamic.dylib" | head -n 1)
          if [ -z "$TSAN_DYLIB" ]; then echo "TSan dylib NOT found"; exit 1; fi
          echo "Using TSan Dylib: $TSAN_DYLIB"
          
          # 2. Use the REAL Python binary, not the uv shim
          # The framework install puts the real binary here:
          REAL_PYTHON="/Library/Frameworks/PythonT.framework/Versions/3.13/bin/python3.13t"
          PYTHON_LIB_DIR="/Library/Frameworks/PythonT.framework/Versions/3.13/lib"
          
          cp "$REAL_PYTHON" /tmp/tsan_python
          
          # 3. Fix @rpath so the binary can find libpython3.13t.dylib from /tmp
          install_name_tool -add_rpath "$PYTHON_LIB_DIR" /tmp/tsan_python
          
          # 4. Remove signature to allow DYLD_INSERT_LIBRARIES
          codesign --remove-signature /tmp/tsan_python
          chmod +x /tmp/tsan_python
          
          # 5. Execute
          export DYLD_INSERT_LIBRARIES=$TSAN_DYLIB
          export TSAN_OPTIONS="second_deadlock_stack=1 halt_on_error=1"
          /tmp/tsan_python tests/benchmark.py --stress


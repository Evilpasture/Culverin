name: Remote Dev Fast-Track

on:
  push:
    branches: [ remote-dev ]

# Automatically cancel old builds if you push again quickly
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast_dev_check:
    name: Quick Build & Test (C23/Clang)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13t"

      - name: Install System Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm ninja-build libvulkan-dev

      - name: Build & Install Project
        env:
          CC: clang
          CXX: clang++
          # Force C23 standard and your required precision flags
          CMAKE_ARGS: >-
            -DCMAKE_C_STANDARD=23
            -DENABLE_SANITIZER=OFF
            -DCMAKE_BUILD_TYPE=Release
            -DDOUBLE_PRECISION=ON
        run: |
          uv pip install numpy psutil
          uv pip install -v . 

      - name: Run Core Tests
        run: |
          uv run python tests/test_core.py
          
      - name: Quick Benchmarks
        run: |
          echo "## Dev Benchmarks ($(date +'%H:%M'))" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          uv run python tests/benchmark.py --leak >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

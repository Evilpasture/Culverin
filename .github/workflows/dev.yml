name: Remote Dev Fast-Track

on:
  push:
    branches: [ remote-dev ]

jobs:
  fast_dev_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13t"

      - name: Install System Build Tools
        run: sudo apt-get update && sudo apt-get install -y clang llvm ninja-build ccache

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-ccache-math-final

      - name: Build & Install
        env:
          CC: clang
          CXX: clang++
          CMAKE_ARGS: >-
            -DCMAKE_C_STANDARD=23
            -DCMAKE_C_FLAGS="-std=c23 -Wno-unknown-attributes"
            -DENABLE_DEBUG_RENDERER=OFF
            -DUSE_VULKAN=OFF
            -G Ninja
        run: |
          # THE FIX: Inject a C23 compatibility shim into the top of your core header
          # This ensures 'constexpr' works even if the compiler falls back to gnu2x/c17
          sed -i '1i #ifndef constexpr\n#if __STDC_VERSION__ < 202311L\n#define constexpr static const\n#endif\n#endif' src/culverin/culverin.h
          
          # Patch submodules just in case
          find . -name "CMakeLists.txt" -exec sed -i 's/CMAKE_C_STANDARD 1[17]/CMAKE_C_STANDARD 23/g' {} +
          
          uv pip install numpy psutil
          uv pip install . 

      - name: Run Core Tests
        run: uv run python tests/test_core.py

name: Remote Dev Fast-Track

on:
  push:
    branches: [ remote-dev ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast_dev_check:
    name: Quick Build & Test (C23 - Math Only)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13t"

      - name: Install System Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm ninja-build ccache

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-ccache-math-only
          restore-keys: ${{ runner.os }}-ccache-

      - name: Build & Install Project
        env:
          CC: clang
          CXX: clang++
          # Setting standard via env as a fallback
          CFLAGS: "-std=c23"
          # The 'Force Multiplier' - putting it in CMAKE_ARGS and CMAKE_C_FLAGS
          CMAKE_ARGS: >-
            -DCMAKE_C_STANDARD=23
            -DCMAKE_C_STANDARD_REQUIRED=ON
            -DCMAKE_C_FLAGS="-std=c23"
            -DCMAKE_C_COMPILER_LAUNCHER=ccache
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
            -DENABLE_SANITIZER=OFF
            -DCMAKE_BUILD_TYPE=Release
            -DDOUBLE_PRECISION=ON
            -DENABLE_DEBUG_RENDERER=OFF
            -DUSE_VULKAN=OFF
            -G Ninja
        run: |
          # 1. Bruteforce patch any hardcoded standards in submodules
          echo "Scanning for hardcoded standards..."
          find . -name "CMakeLists.txt" -exec sed -i 's/CMAKE_C_STANDARD 1[17]/CMAKE_C_STANDARD 23/g' {} +
          
          # 2. Install dependencies
          uv pip install numpy psutil
          
          # 3. Build with -v so we can see the final flag order in the logs
          uv pip install -v . 

      - name: Run Core Tests
        run: |
          uv run python tests/test_core.py

name: Culverin M-Series CI

on:
  push:
    branches: [ remote-dev ]
  pull_request:
    branches: [ main ]

jobs:
  # Standard Build for Release
  build_wheels:
    name: Build Wheels (cp313t)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v5
      - name: Build
        uses: pypa/cibuildwheel@v3.4.0
        env:
          CIBW_BUILD: "cp313t-macosx_arm64"
          CIBW_ENABLE: "cpython-freethreading"
          CIBW_BUILD_FRONTEND: "uv"
          CIBW_ENVIRONMENT_MACOS: >
            MACOSX_DEPLOYMENT_TARGET=14.0
            CMAKE_ARGS="-DCMAKE_BUILD_TYPE=Release"

  # THE DEDICATED TSAN SCANNER
  tsan_race_detector:
    name: TSan Deep Scan
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install LLVM & Tools
        run: |
          brew install llvm ninja
          echo "/opt/homebrew/opt/llvm/bin" >> $GITHUB_PATH

      - name: Build Extension with TSan
        run: |
          # Use the uv-provided 3.13t
          uv venv --python 3.13t
          source .venv/bin/activate
          uv pip install numpy psutil setuptools scikit-build-core
          
          export CC="/opt/homebrew/opt/llvm/bin/clang"
          export CXX="/opt/homebrew/opt/llvm/bin/clang++"
          export CFLAGS="-fsanitize=thread -g -fno-omit-frame-pointer"
          export LDFLAGS="-fsanitize=thread"
          
          uv pip install -e . --no-build-isolation

      - name: Run TSan Stress Test
        run: |
          source .venv/bin/activate
          
          # 1. Improved TSan dylib discovery
          TSAN_DYLIB=$(find /opt/homebrew/opt/llvm -name "libclang_rt.tsan_osx_dynamic.dylib" | head -n 1)
          if [ -z "$TSAN_DYLIB" ]; then
            # Fallback to standard xcode path if brew find fails
            TSAN_DYLIB="/Applications/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/lib/clang/$(ls /Applications/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/lib/clang | head -1)/lib/darwin/libclang_rt.tsan_osx_dynamic.dylib"
          fi
          echo "Using TSan Dylib: $TSAN_DYLIB"
          
          # 2. Extract paths
          REAL_PYTHON_PATH=$(python -c "import sys, os; print(os.path.realpath(sys.executable))")
          PYTHON_LIB_DIR=$(python -c "import sysconfig; print(sysconfig.get_config_var('LIBDIR'))")
          
          # 3. Create a thin binary in /tmp
          # lipo -extract often "repairs" or cleans up Mach-O headers, 
          # but more importantly, we'll avoid install_name_tool and use DYLD_LIBRARY_PATH
          lipo -extract arm64 "$REAL_PYTHON_PATH" -output /tmp/tsan_python
          
          # 4. Strip signature
          codesign --remove-signature /tmp/tsan_python
          chmod +x /tmp/tsan_python
          
          # 5. Run with environment-based library resolution
          # DYLD_LIBRARY_PATH tells the loader where to find libpython3.13t.dylib
          # DYLD_INSERT_LIBRARIES injects the TSan runtime
          export DYLD_LIBRARY_PATH="$PYTHON_LIB_DIR"
          export DYLD_INSERT_LIBRARIES="$TSAN_DYLIB"
          export TSAN_OPTIONS="second_deadlock_stack=1 halt_on_error=1"
          
          arch -arm64 /tmp/tsan_python tests/benchmark.py --stress


name: Culverin Hybrid CI

on:
  push:
    branches: [ remote-dev, main ]
  pull_request:
    branches: [ main ]

jobs:
  macos_release:
    name: M-Series C23 Release (Clang 22)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v5
      - name: Build Performance Wheels
        uses: pypa/cibuildwheel@v3.4.0
        env:
          CIBW_BUILD: "cp313t-macosx_arm64"
          CIBW_ENABLE: "cpython-freethreading"
          CIBW_BUILD_FRONTEND: "uv"
          MACOSX_DEPLOYMENT_TARGET: "13.0"
          CIBW_BEFORE_ALL: brew install llvm@22
          CIBW_ENVIRONMENT: >
            CC="$(brew --prefix llvm@22)/bin/clang"
            CXX="$(brew --prefix llvm@22)/bin/clang++"
            LDFLAGS="-L$(brew --prefix llvm@22)/lib -Wl,-rpath,$(brew --prefix llvm@22)/lib"
            CPPFLAGS="-I$(brew --prefix llvm@22)/include"
            CMAKE_ARGS="-DCMAKE_C_STANDARD=23 -DCMAKE_C_STANDARD_REQUIRED=ON -DCMAKE_BUILD_TYPE=Release -DJPH_USE_MTL=OFF"
          # FIX: Added missing test requirements
          CIBW_TEST_REQUIRES: numpy psutil pytest
          CIBW_TEST_COMMAND: "python {project}/tests/benchmark.py --stress"

  linux_tsan:
    name: TSan C23 Deep Scan (Clang 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v5
      - name: Build with TSan
        uses: pypa/cibuildwheel@v3.4.0
        env:
          CIBW_MANYLINUX_X86_64_IMAGE: "quay.io/pypa/manylinux_2_34_x86_64"
          CIBW_BUILD: "cp313t-manylinux_x86_64"
          CIBW_ENABLE: "cpython-freethreading"
          CIBW_BUILD_FRONTEND: "uv"
          # FIX: Universal installer logic for manylinux
          CIBW_BEFORE_ALL_LINUX: >
            (type apt-get >/dev/null 2>&1 && apt-get update && apt-get install -y wget lsb-release gnupg) || 
            (type dnf >/dev/null 2>&1 && dnf install -y wget xz) &&
            wget https://apt.llvm.org/llvm.sh && chmod +x llvm.sh && ./llvm.sh 22 || true
          
          CIBW_ENVIRONMENT: >
            CC=clang-22
            CXX=clang++-22
            CFLAGS="-fsanitize=thread -g -O1 -fno-omit-frame-pointer"
            LDFLAGS="-fsanitize=thread -Wl,--allow-shlib-undefined"
            CMAKE_ARGS="-DCMAKE_C_STANDARD=23 -DCMAKE_C_STANDARD_REQUIRED=ON -DENABLE_THREAD_SANITIZER=ON"
          CIBW_TEST_REQUIRES: numpy psutil pytest
          CIBW_TEST_COMMAND: >
            TSAN_LIB=$(find /usr/lib -name "libclang_rt.tsan-x86_64.so" | head -n 1) &&
            LD_PRELOAD=$TSAN_LIB 
            TSAN_OPTIONS="second_deadlock_stack=1 halt_on_error=1" 
            python {project}/tests/benchmark.py --stress

name: Remote Dev Fast-Track

on:
  push:
    branches: [ remote-dev ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast_dev_check:
    name: Quick Build & Test (C23 - Math Only)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13t"

      - name: Install System Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm ninja-build ccache

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-ccache-math-only
          restore-keys: ${{ runner.os }}-ccache-

      - name: Build & Install Project
        env:
          CC: clang
          CXX: clang++
          # Force C23 at the environment level
          CFLAGS: "-std=c23"
          # Tell scikit-build specifically what we want
          SKBUILD_CMAKE_ARGS: "-DCMAKE_C_STANDARD=23;-DCMAKE_CXX_STANDARD=20"
          CMAKE_ARGS: >-
            -DCMAKE_C_STANDARD=23
            -DCMAKE_C_COMPILER_LAUNCHER=ccache
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
            -DENABLE_SANITIZER=OFF
            -DCMAKE_BUILD_TYPE=Release
            -DDOUBLE_PRECISION=ON
            -DENABLE_DEBUG_RENDERER=OFF
            -DUSE_VULKAN=OFF
            -G Ninja
        run: |
          uv pip install numpy psutil
          uv pip install . 

      - name: Run Core Tests
        run: |
          uv run python tests/test_core.py

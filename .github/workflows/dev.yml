name: Culverin Hybrid CI

on:
  push:
    branches: [ remote-dev, main ]
  pull_request:
    branches: [ main ]

jobs:
  # ------------------------------------------------------------------
  # JOB 1: THE RELEASE RUNNER (macOS ARM64)
  # Focus: Speed, Apple Silicon, and C23 Release Performance
  # ------------------------------------------------------------------
  macos_release:
    name: M-Series Release Build (cp313t)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v5
      - name: Build Performance Wheels
        uses: pypa/cibuildwheel@v3.4.0
        env:
          CIBW_BUILD: "cp313t-macosx_arm64"
          CIBW_ENABLE: "cpython-freethreading"
          CIBW_BUILD_FRONTEND: "uv"
          CIBW_ENVIRONMENT: >
            CMAKE_ARGS="-DCMAKE_C_STANDARD=23 -DCMAKE_BUILD_TYPE=Release"
          CIBW_TEST_COMMAND: "python {project}/tests/benchmark.py --stress"

  # ------------------------------------------------------------------
  # JOB 2: THE SAFETY RUNNER (Linux x86_64)
  # Focus: TSan Race Detection & C23 Validation
  # ------------------------------------------------------------------
  linux_tsan:
    name: TSan Deep Scan (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v5
      
      - name: Build with TSan
        uses: pypa/cibuildwheel@v3.4.0
        env:
          CIBW_BUILD: "cp313t-manylinux_x86_64"
          CIBW_ENABLE: "cpython-freethreading"
          CIBW_BUILD_FRONTEND: "uv"
          
          # Use Before All to get the modern Clang 18 toolchain
          CIBW_BEFORE_ALL_LINUX: >
            dnf install -y clang-18 llvm-18 lld-18 &&
            ln -sf /usr/bin/clang-18 /usr/bin/clang &&
            ln -sf /usr/bin/clang++-18 /usr/bin/clang++

          CIBW_ENVIRONMENT: >
            CC=clang
            CXX=clang++
            CFLAGS="-fsanitize=thread -g -fno-omit-frame-pointer"
            LDFLAGS="-fsanitize=thread"
            CMAKE_ARGS="-DCMAKE_C_STANDARD=23 -DENABLE_THREAD_SANITIZER=ON"

          CIBW_TEST_REQUIRES: numpy psutil pytest
          CIBW_TEST_COMMAND: >
            TSAN_OPTIONS="second_deadlock_stack=1 halt_on_error=1 history_size=7" 
            python {project}/tests/benchmark.py --stress


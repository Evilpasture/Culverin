name: Culverin Multi-Platform CI

on:
  push:
    branches: [ remote-dev, main ]
  pull_request:
    branches: [ main ]

jobs:
  build_wheels:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: TSan Safety (Linux x86_64)
            os: ubuntu-latest
            artifact: linux
            # Manylinux 2.28 uses DNF
            before_all: >
              dnf install -y clang-18 llvm-18 lld-18 &&
              ln -sf /usr/bin/clang-18 /usr/bin/clang &&
              ln -sf /usr/bin/clang++-18 /usr/bin/clang++

          - name: TSan Safety (macOS arm64)
            os: macos-14  # Apple Silicon M1/M2/M3
            artifact: macos
            # Brew is the way for macOS
            before_all: >
              brew install llvm@18 &&
              echo "CC=$(brew --prefix llvm@18)/bin/clang" >> $GITHUB_ENV &&
              echo "CXX=$(brew --prefix llvm@18)/bin/clang++" >> $GITHUB_ENV

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build and Test
        uses: pypa/cibuildwheel@v3.4.0
        env:
          CIBW_BUILD: "cp313t-*"
          CIBW_ENABLE: "cpython-freethreading"
          CIBW_BUILD_FRONTEND: "uv"
          
          # Use matrix-specific installation
          CIBW_BEFORE_ALL: ${{ matrix.before_all }}

          CIBW_ENVIRONMENT: >
            CC=clang
            CXX=clang++
            CFLAGS="-fsanitize=thread -g -fno-omit-frame-pointer"
            LDFLAGS="-fsanitize=thread"
            CMAKE_ARGS="-DCMAKE_C_STANDARD=23 -DCMAKE_C_STANDARD_REQUIRED=ON -DENABLE_THREAD_SANITIZER=ON"

          CIBW_TEST_REQUIRES: numpy psutil pytest
          CIBW_TEST_COMMAND: >
            TSAN_OPTIONS="second_deadlock_stack=1 halt_on_error=1 history_size=7" 
            python {project}/tests/benchmark.py --stress


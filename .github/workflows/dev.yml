name: Remote Dev Fast-Track

on:
  push:
    branches: [ remote-dev ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast_dev_check:
    name: Rapid Build & Test (C23 - 3.13t)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build and Test (Isolated Container)
        uses: pypa/cibuildwheel@v3.4.0
        env:
          # Only build freethreaded 3.13 for the quickest validation
          CIBW_BUILD: "cp313t-manylinux_x86_64"
          CIBW_ENABLE: "cpython-freethreading"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          
          CIBW_BUILD_FRONTEND: "uv"

          # Force C23 inside the build environment
          CIBW_ENVIRONMENT: >
            CC=clang
            CXX=clang++
            CMAKE_GENERATOR=Ninja
            CMAKE_ARGS="-DCMAKE_C_STANDARD=23 -DCMAKE_C_STANDARD_REQUIRED=ON -DENABLE_SANITIZER=OFF -DCMAKE_BUILD_TYPE=Release -DDOUBLE_PRECISION=ON"

          CIBW_BEFORE_ALL_LINUX: >
            dnf install -y clang llvm &&
            pip install ninja

          CIBW_TEST_REQUIRES: numpy psutil
          CIBW_TEST_COMMAND: "python {project}/tests/test_core.py"

      - name: Upload Dev Wheel
        uses: actions/upload-artifact@v7
        with:
          name: culverin-dev-wheel
          path: ./wheelhouse/*.whl

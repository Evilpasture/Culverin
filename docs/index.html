<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Culverin Physics Engine</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="High-performance Jolt-powered Physics for Python">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- Modern Themes -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💣</text></svg>">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify/themes/pure.css">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/style.min.css">

  <style>
    :root {
      --docsifytabs-border-color: #ededed;
      --docsifytabs-tab-highlight-color: #42b983;
    }
    /* Make the sidebar headers look cleaner */
    .sidebar-nav strong {
      color: #2c3e50;
      font-size: 1.1rem;
    }
    /* Indent methods under classes in the jump table */
    .sidebar-nav ul ul {
      margin-left: 15px;
    }
    .sidebar-nav li > a {
      font-family: 'Fira Code', 'JetBrains Mono', monospace; /* Very on-brand for your toolchain */
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="app">Loading Culverin Docs...</div>
  <script>
    window.$docsify = {
      name: 'Culverin Physics',
      repo: 'Evilpasture/Culverin',
      
      // Sidebar Configuration
      loadSidebar: true, 
      autoHeader: true,
      subMaxLevel: 3, 
      homepage: 'DOCS.md',
      
      // Navigation
      auto2top: true,
      mergeNavbar: true,
      
      // Search Plugin
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search API...',
        noData: 'No Results Found',
        depth: 6
      },

      // Copy Code Plugin
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied'
      }
    }
  </script>

  <!-- Docsify Core -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/docsify.min.js"></script>
  
  <!-- Plugins -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-c.min.js"></script>
  
  <!-- Dark Mode Toggle -->
  <script src="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/index.min.js"></script>
</body>
</html>
